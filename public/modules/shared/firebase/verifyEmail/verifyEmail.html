<section class="verify-section">
    <!-- Espada de fondo -->
    <div class="sword-bg">
        <img class="sword-image" src="/assets/img/espada.svg" alt="" loading="lazy" />
    </div>

    <div class="verify-container">
        <!-- Verify Content -->
        <div class="verify-content">
            <!-- Brand Header -->
            <header class="verify-header">
                <div class="logo-ring">
                    <i class="fas fa-envelope-circle-check logo-icon-verify"></i>
                    <div class="logo-pulse"></div>
                </div>
                <h1 class="brand-title">VERIFICA TU CORREO</h1>
                <div class="divider-line">
                    <div class="divider-diamond"></div>
                </div>
            </header>

            <!-- Verify Card -->
            <div class="verify-card form-card">
                <div class="form-scanline"></div>

                <!-- Contenido dinámico -->
                <div id="verifyContent">
                    <!-- Estado de carga (se muestra por defecto) -->
                    <div class="loading-state" id="loadingState">
                        <div class="spinner"></div>
                        <p class="loading-text">Verificando tu correo electrónico...</p>
                    </div>
                </div>
            </div>

            <!-- Footer Motto -->
            <footer class="verify-footer">
                <div class="motto-divider">
                    <i class="fas fa-grip-lines"></i>
                    <div class="motto-line"></div>
                    <i class="fas fa-grip-lines"></i>
                </div>
                <p class="motto-text">
                    CADA DÍA UNA <span class="text-primary">BATALLA</span>. CADA DÍA UNA <span class="text-secondary">VICTORIA</span>.
                </p>
            </footer>
        </div>
    </div>
</section>

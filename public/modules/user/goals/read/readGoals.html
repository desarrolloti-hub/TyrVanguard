<section class="goals-section">
    <!-- Espada de fondo -->
    <div class="sword-bg subtle">
        <img class="sword-image" src="/assets/img/espada.svg" alt="" loading="lazy" />
    </div>

    <div class="goals-container">
        <!-- ==========================================
             HEADER DE METAS
             ========================================== -->
        <header class="goals-header">
            <div class="goals-header-left">
                <div class="goals-badge">
                    <i class="fas fa-bullseye"></i>
                    <span>MIS METAS</span>
                </div>
                <h1 class="goals-title">
                    Mis <span>Objetivos</span>
                </h1>
                <p class="goals-subtitle">
                    "Un guerrero sin metas es como un barco sin rumbo. Define tu destino y conquístalo."
                </p>
            </div>
            <div class="goals-header-right">
                <button class="btn btn-primary" id="newGoalBtn">
                    <i class="fas fa-plus"></i> NUEVA META
                </button>
            </div>
        </header>

        <!-- ==========================================
             FILTROS Y BÚSQUEDA
             ========================================== -->
        <div class="goals-filters">
            <div class="filter-group">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        class="form-input" 
                        id="searchGoal" 
                        placeholder="Buscar metas..."
                    />
                </div>
                <select class="form-select" id="filterStatus">
                    <option value="all">Todas las metas</option>
                    <option value="pending">Pendientes</option>
                    <option value="in_progress">En Curso</option>
                    <option value="completed">Completadas</option>
                    <option value="abandoned">Abandonadas</option>
                </select>
                <select class="form-select" id="filterCategory">
                    <option value="all">Todas las categorías</option>
                    <option value="personal">Personal</option>
                    <option value="professional">Profesional</option>
                    <option value="health">Salud</option>
                    <option value="spiritual">Espiritual</option>
                    <option value="social">Social</option>
                </select>
            </div>
            <div class="filter-stats">
                <span class="filter-stat">
                    <i class="fas fa-bullseye"></i>
                    <span id="goalCount">0</span> metas
                </span>
                <span class="filter-stat">
                    <i class="fas fa-check-circle" style="color: #34d399;"></i>
                    <span id="completedCount">0</span> completadas
                </span>
            </div>
        </div>

        <!-- ==========================================
             LISTA DE METAS (TARJETAS)
             ========================================== -->
        <div class="goals-grid" id="goalsGrid">
            <!-- Renderizado dinámico -->
        </div>

        <!-- ==========================================
             PAGINACIÓN
             ========================================== -->
        <div class="goals-pagination">
            <button class="btn btn-ghost btn-sm" id="prevPage" disabled>
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <span class="pagination-info" id="paginationInfo">Página 1 de 1</span>
            <button class="btn btn-ghost btn-sm" id="nextPage" disabled>
                Siguiente <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <!-- ==========================================
             ESTADO VACÍO
             ========================================== -->
        <div class="goals-empty" id="goalsEmpty" style="display: none;">
            <div class="empty-icon">
                <i class="fas fa-bullseye"></i>
            </div>
            <h3 class="empty-title">Aún no hay metas</h3>
            <p class="empty-text">
                Define tus objetivos y comienza a forjar tu camino.
                <br> Cada meta es un paso hacia la grandeza.
            </p>
            <button class="btn btn-primary" id="emptyNewGoalBtn">
                <i class="fas fa-plus"></i> CREAR PRIMERA META
            </button>
        </div>
    </div>
</section>
